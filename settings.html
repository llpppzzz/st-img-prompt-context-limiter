<div>
    <h3 data-i18n="ipl_title">Image Prompt Context Limit</h3>
    <label for="ipl_enabled" class="checkbox_label">
        <input id="ipl_enabled" type="checkbox" />
        <span data-i18n="ipl_enabled_txt">Limit chat history for image prompt generation</span>
    </label>
    <label for="ipl_limit" data-i18n="ipl_limit_txt">Chat messages to send</label>
    <select id="ipl_limit" class="text_pole">
        <option value="1" data-i18n="ipl_limit_1">1 (last message only)</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="0" data-i18n="ipl_limit_0">All messages</option>
    </select>
    <small data-i18n="ipl_hint">Only the image prompt template (system) and the last N chat messages are sent to the LLM; character card, scenario, world info, jailbreak, and other system prompts are skipped. The template is sent as the last message.</small>
</div>
